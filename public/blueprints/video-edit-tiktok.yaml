# AgentSpace Blueprint — TikTok Canlı Yayın Video Edit (Remotion)
# Miras: _base-media.yaml (medya evrensel kuralları geçerli; yazılım kuralları DEĞİL)
# Kaynak bilgi tabanı: ~/tiktok-edit/docs — KURALLARIN TEK KAYNAĞI docs/05-kurallar-ve-dersler.md'dir;
# bu dosya özet/işaretçidir, çelişkide docs kazanır. (v1.1.0 — 2026-08-21 SEZER işi sonrası güncellendi)

id: "video-edit-tiktok"
version: "1.1.0"
name: "TikTok Canlı Yayın Video Edit"
project_type: "media"
domain: "media"
inherits: "_base-media"

description: |
  TikTok canlı yayın kayıtlarından (hediye / seviye atlama / yayın özeti) müşteri için
  kısa video üreten Remotion + ffmpeg pipeline'ı. Dört onaylı iş tipi vardır: BENİ SEV (40+ seviye,
  muhafız teması; başta seviye ekranı ŞART ama her videoda farklı intro tarzı), NORMAL LEVEL ATLAMA (sade AI
  + bant, elmas yok), ÖZEL LEVEL ATLAMA (detaylı AI + elmas patlatma) ve YAYIN ÖZETİ / RECAP (efektsiz,
  sessiz arşiv). GENEL İLKE (müşteri teyidi): hediye/canlı ekranlarında MİNİMUM animasyon — efekt bütçesi
  AI sahnelere. İş tipi ve müzik linki netleşmeden kurgu başlamaz.

tags: ["video", "remotion", "ffmpeg", "tiktok", "capcut", "edit", "recap"]

# ─────────────────────────────────────────────
# ÜRETİM MİMARİSİ
# ─────────────────────────────────────────────
architecture:
  pattern: "Analiz ➔ Plan (JSON) ➔ Remotion/ffmpeg Render ➔ Kare+dB Doğrulama ➔ Müşteri Onayı"
  description: |
    1) detect.py / gift_scan ile sinyal tespiti, kontakt föyü ile GÖZLE sınıflandırma.
    2) Segment tablosu (t0, t1, tip, hız) plan JSON'una yazılır — render bu plandan üretilir.
    3) Vitrin/Saray: Remotion kompozisyonu; Recap: sessizse yalnız ffmpeg.
    4) panel_scan + frame extract + volumedetect ile QA; sonra teslim.
  work_types:
    beni_sev: "40+ SEVİYE atlamaları, 'muhafız' teması. ZORUNLU: başta seviye ekranı + 1→N sayaç bandı (gerçek bandın replikası) — ama her videoda FARKLI intro tarzı (docs/00 'intro TARZ KAYDI': Nur/Tony = alevli telefon vitrini, SEZER = sinematik altın kart; sıradaki yeni tarz). Sonra AI muhafız sahnesi → müziğin en sert vuruşunda patlama → hediyeler gerçek TikTok sesleriyle (assets/hediye-sesleri) → karanlık bitiş. Müzik müşteriden (TikTok sesi linki). Örnekler: tony_final, NurMix, sezer3_final (SezerMix3)"
    level_normal: "Sıradan seviye: TikTokçuya özel, kişiyi lüks gösteren sade AI video + bant; ELMAS PATLATMA YOK; hediye bölümü minimum animasyon (GizemMix, DuyguMix)"
    level_ozel: "Özel/önemli seviye: detaylı AI video + elmas patlatma; 5 perde, AI perdelerinde büyük whip/liquid + mega patlama, 3 müzik kilidi (SarayMix) — hediye şelalesi perdesi artık MİNİMUM animasyon (docs/08 uyarısı)"
    recap: "Yayın özeti: sadece hediyeler, kamera efekti yok, sessiz, hassas crop, değer→hız (AmoRecap)"

# ─────────────────────────────────────────────
# ONAYLANMIŞ KURALLAR (müşteri geri bildirimiyle kesinleşti)
# ─────────────────────────────────────────────
code_standards:
  principles:
    - "TEK kutu kuralı: sentetik sayaç bandı videodaki GERÇEK banner'ın birebir replikası olur ve onun üstüne oturur"
    - "İlk klip dokunulmaz: sınır kare kare doğrulanır; hızlandırma kararma/geçiş İÇİNDE başlar"
    - "Alev = filaman: keskin beyaz-sarı çekirdek + dar bant, blur yalnız dış halede"
    - "Telefon = gerçek cihaz: koyu bezel + derin gölge + zemin gölgesi + cam yansıması"
    - "Bitişler: aydınlanma (ışık sarar) veya karanlık (gölgeler kapanır); ses her zaman görüntüyle söner"
    - "Sayaç okunurluğu: kameradan bağımsız sabit katman; uzun unicode isimlerde font küçült"
    - "Müzik videoya tam oturur: ya sona kilitle ya süreyi eşitle — ortada müziksiz kuyruk yok"
    - "RECAP: sadece hediyeler — davet paneli, bağlantı diyaloğu, istek listesi, klavye TEK KARE görünmez"
    - "RECAP: değer → hız (pahalı 1.3x, spam 2.6x), sıra kronolojik, final en dramatik hediyeye kilitlenir"
    - "RECAP crop: liderlik tablosu + yayıncı adı kadrajda kalır; üstten yalnız durum çubuğu atılır"
    - "Level videosu sınıfı baştan sorulur: NORMAL (tek AI sahne + bant zoom) mı ÖZEL/BÜYÜK (güçlü AI sahneler + elmas patlatma) mı"
    - "GENEL İLKE (tüm tipler): hediye/canlı ekranı = MİNİMUM animasyon — blur, chromatic, glow, grain, halka, kıvılcım YOK; canlı renk (saturate ~1.35); zoom ≤ 9:20→9:16 pillarbox kırpması (1.25) + 0.1; kesme = hard cut + kısa flaş; sarsıntı yalnız kükreme anında, hafif"
    - "Beni Sev intro: seviye ekranı başta ŞART, her videoda FARKLI tarz; kullanılmış tarzları docs/00 tarz kaydından kontrol et, tekrar etme"
    - "Hediye sesleri: kayıt sesi KAPALI (yayın müziği sızar); gerçek TikTok hediye sesleri ~/tiktok-edit/assets/hediye-sesleri'nden, tek görsel ankere (ağız açılışı/kafa kalkışı) kilitlenir — docs/10"
    - "Müzik: müşteri link verirse o (TikTok sesi aweme API ile iner — docs/03); drop = patlama, bölüm değişimi = canlıya geçiş, tüm kesmeler beat gridinde; kısa ses bar sınırında döngülenir"
    - "Yeni işe SADE başla: geri bildirim hep 'çıkar' yönünde gelir; efekt eklemek çıkarmaktan ucuz"
    - "Her tipografi/gradient için --frames ile kısa test render (still yetmez: background-clip+filter videoda dikdörtgen olur)"

  forbidden:
    - "Karalama: UI gizlemek için yarı saydam yama — ya bezel/kırpma gibi doğal çözüm ya hiç"
    - "Sağa-sola pan bitişi (reddedildi)"
    - "İkinci/farklı görünümlü sayaç kutusu (reddedildi)"
    - "Vitrin girişine SFX eklemek — yalnız orijinal ses (Beni Sev'in müzikli devamı hariç)"
    - "Whoosh ('fiyuv') ve shimmer ('tıss') SFX — hiçbir tipte; kesme/vuruşta yalnız düşük boom"
    - "Çember halkası (ShockRings) ve yatay ışın süpürmesi (FlareSweep) — AI sahnede de YOK"
    - "Aynı Beni Sev intro tarzını iki videoda tekrar kullanmak"
    - "Hediye ekranına glow bloom / blur / chromatic / agresif zoom-dalış (Saray'ın hediye perdesi dili artık kullanılmaz)"
    - "Jenerik stok SFX/müzik — ama müşterinin verdiği müzik ve gerçek TikTok hediye sesleri SERBEST (kaynakta ses olmasa da)"
    - "RECAP'te kamera efekti: shake, zoom, whip, punch-in, RGB ayrışması, titreme"
    - "RECAP'te jenerik ses: Universe alım sesi, money gun, boom/whoosh/shimmer — kaynakta yoksa SESSİZ"
    - "Agresif üst crop (ör. 330px) — liderlik tablosunu götürür"
    - "Tek-kare föy ile aday sınıflandırma — aday başına 8 karelik şerit zorunlu"
    - "Föy örneklemesiyle panel temizliği varsaymak — panel_scan taraması zorunlu"

# ─────────────────────────────────────────────
# TEKNİK DERSLER (yaşanmış hatalar — tekrar etme)
# ─────────────────────────────────────────────
lessons:
  remotion:
    - "sframe dersi: startFrom ile kaydırırken spring'ler kare bazlı → sframe = frame + START*fps"
    - "camX clamp: pan aralığını kare tabanlı [T_PAN,…] yap, 0'dan başlat"
    - "Loop volume: <Audio loop> volume callback her turda sıfırlanır → zarfı kompozisyon zamanından hesapla"
    - "interpolate monotonluk: sed ile sabit güncelledikten sonra grep'le doğrula"
  ffmpeg:
    - "concat AAC ses kayması: segment bazlı ses, tek geçişte birleştir"
    - "add-audio süresi kaynaktan uzun olamaz"
    - "yt-dlp çıktısı AV1/Opus olabilir → H.264/AAC'ye çevir"
  remotion_v2:
    - "background-clip:text + CSS filter → videoda metin düz dikdörtgen (still'de görünmez): gölge ayrı textShadow katmanı, filtre yok, kısa --frames test"
    - "Slow-mo: ffmpeg minterpolate (mci/aobmc/bidir/vsbmc) 24fps AI'da 0.4x'e kadar artefaktsız"
    - "Kısmi render --frames=a-b tüm sabitleri korur; intro atmak için yeterli"
  audio_v2:
    - "mp3 decode tepesi +5 dBFS olabilir → müzik -6/-8 dB wav, render sonrası alimiter; tepe ölçümü stereo/48k (mono downmix abartır)"
    - "Kısa TikTok sesi (25s): bar sınırında döngüle, sıçrama anını kükreme/uluma duck penceresine koy"
    - "tiktok:sound extractor kırık; aweme API music/aweme ucu play_url veriyor (docs/03, skill tiktok-indir)"
  workflow:
    - "Notları kaynağından doğrula: 'o iki ses' = yavru da kükrüyor (10fps şerit); tahmin etme"
    - "7 sürümün 5'i efekt/ses ÇIKARMA oldu — ilk sürümü minimum efektle çıkar"
    - "QuickTime stale dosya: aynı isme render etme, yeni isimli kopya aç"
    - "Paralel oturum: hafıza dosyası değiştiyse önce dosya sistemini oku, var olan işi ezme"
    - "Yanlış pozitif renk metriği: turuncu yele 'kırmızı banner' sanıldı — metrik + görsel şerit birlikte"

# ─────────────────────────────────────────────
# QA KAPILARI (testing = doğrulama)
# ─────────────────────────────────────────────
testing:
  framework: "ffmpeg frame extract + volumedetect + panel_scan.py"
  rules:
    - "Teslim öncesi 3 kontrol noktası: giriş (ilk 1s), geçişler, kuyruk (son 1s — fade altında diyalog sızıntısı yok)"
    - "RECAP: panel_scan.py ile tam tarama; kirli segment trim/at, tekrar tara"
    - "Level/Saray: kükreme/drop senkronu kare numarasıyla doğrulanır"
    - "Müşteri WhatsApp sesli geri bildirimi whisper ile çözülür, madde madde kural dokümanına işlenir"

# ─────────────────────────────────────────────
# AJAN ROLLERİ
# ─────────────────────────────────────────────
agent_roles:
  analyst:
    count: 1
    model_tier: 1
    color: "blue"
    responsibilities:
      - "Kaynak analizi: proxy + mono ses çıkar, sinyal tespiti (detect.py / gift_scan)"
      - "Kontakt föyü üret, adayları GÖZLE sınıflandır, segment tablosunu yaz"
      - "İş tipini (vitrin / level / recap) ve level sınıfını (NORMAL / BÜYÜK) netleştir"
  editor:
    count: 1
    model_tier: 1
    color: "yellow"
    responsibilities:
      - "Plan JSON'undan Remotion kompozisyonunu kur (AI sahne, banner, zoom, geçişler)"
      - "Recap'te yalnız ffmpeg ile kes/hızlandır/birleştir"
      - "Her render'ı yeni isimle, mutlak yolla üret"
  sound:
    count: 1
    model_tier: 2
    color: "green"
    responsibilities:
      - "Müzik kilidi matematiği (sona kilitle / süreyi eşitle), ducking, kükreme pencereleri"
      - "-90 dB kontrolü, AAC kayması, codec uyumu"
      - "Hediye sesleri kütüphaneden (docs/10), whoosh/shimmer yok; müşteri müziği varsa drop/bölüm kilitleri"
  qa:
    count: 1
    model_tier: 2
    color: "red"
    responsibilities:
      - "Kare + dB doğrulama, panel_scan taraması, sınır kareleri"
      - "Müşteri kurallarına karşı kontrol listesi (docs/05 #1-16 + genel ilke: hediye ekranı minimum animasyon)"
      - "Geri bildirimi kural dokümanına işle"

# ─────────────────────────────────────────────
# BAŞLANGIÇ BAĞLAMI (ajan sistem promptu)
# ─────────────────────────────────────────────
initial_feed:
  - "Sen TikTok canlı yayın kliplerinden müşteri videosu üreten bir kurgu ekibisin. Araçlar: ffmpeg, Remotion, python (detect.py, beats.py, panel_scan.py)."
  - "Bilgi tabanı ~/tiktok-edit/docs altındadır; işe başlamadan ÖNCE docs/05-kurallar-ve-dersler.md (müşteri kuralları #10-16 + genel ilke) ve ilgili tipin dokümanını (06-sablonlar, 08-level-atlama, 09-yayin-ozeti, 10-hediye-sesleri) oku. ~/tiktok-edit/CLAUDE.md haritadır."
  - "İlk 5 soru: (1) kaçıncı seviye/özel mi, (2) müzik linki, (3) hangi hediyeler, (4) intro tarzı (Beni Sev'de daha önce kullanılmamış), (5) yasaklar. Müzik netleşmeden render yok."
  - "Oturum sonunda /ders-kaydet: yeni kural/ders/ses dosyasını docs'a işle ve commit et — hafıza haritası docs'tan beslenir, ajan yazmazsa öğrenilen kaybolur."
  - "Önce SOR: kaçıncı seviye, özel mi? 40+ → BENİ SEV (muhafız teması); değilse NORMAL LEVEL (lüks sade, elmas yok) ya da ÖZEL LEVEL (detaylı AI + elmas patlatma); arşiv → RECAP. Her tipin efekt dili farklıdır, karıştırma."
  - "Müşteri başına not tut: tercihleri, yasakları, onaylı çıktıları. Yeni iş o notla başlar."
  - "Hiçbir render 'çalıştı' diye teslim edilmez — kare çıkar, dB ölç, sonra sun."
  - "Kayıt sesi asla kullanılmaz; hediye sesleri assets/hediye-sesleri kütüphanesinden (gerçek TikTok sesleri), müzik müşteriden. Jenerik stok SFX yok; whoosh/shimmer/çember/ışın yok."
