name: Release (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            targets: aarch64-apple-darwin
          # Windows 10/11 x64 — NSIS setup .exe + MSI (WebView2 bootstrapper bundled by NSIS).
          - platform: windows-latest
            args: ''
            targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tag push -> creates a draft GitHub release with the bundles.
      # workflow_dispatch -> build-only sanity run (no release).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('AgentSpace {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

      # Always keep the bundles as workflow artifacts (also for workflow_dispatch
      # runs, which create no release) — download from the run's Summary page.
      - uses: actions/upload-artifact@v4
        with:
          name: agentspace-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
